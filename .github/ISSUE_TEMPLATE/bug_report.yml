name: Bug report
description: The tool crashes, a file fails to open or export, or the page misbehaves.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach real documents.** If a file is needed, recreate the problem with a fictional one.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 131 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: From the browser console (F12), if any.
      render: text
  - type: checkboxes
    id: noreal
    attributes:
      label: Check
      options:
        - label: Nothing I attached or pasted contains real personal data.
          required: true
